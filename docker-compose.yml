services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ENV_FILE: ${ENV_FILE:-.env.dev}
    depends_on:
      - db
    env_file:
      - ".env"

  db:
    image: postgres:15
    restart: always
    container_name: postgres-db
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./frontend/web
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev -- --host

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"

volumes:
  pgdata: